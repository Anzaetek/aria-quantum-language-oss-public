\* TLC configuration for Governor.tla
\*
\* A deliberately tiny instance: three jobs against a 4-unit budget, where two
\* small jobs (1 each) can cycle indefinitely while one large job (3) waits.
\* Exhaustive over this state space, which is where the bug lives — starvation
\* does not need scale to appear, only an interleaving.

SPECIFICATION Spec

CONSTANTS
    Jobs = {s1, s2, big}
    Capacity = 4
    Weight = [s1 |-> 1, s2 |-> 1, big |-> 3]

INVARIANT
    TypeOK
    NeverExceedsCapacity
    NoDoubleAccounting

\* Expected to FAIL, and the failure is the finding: it produces the concrete
\* interleaving in which `big` is starved by recycling small jobs. Comment this
\* out to check safety alone.
PROPERTY
    EventuallyAdmitted
