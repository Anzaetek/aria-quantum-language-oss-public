\* The server BEFORE admission control: any submitted job simply starts.
\* NeverExceedsCapacity is EXPECTED TO FAIL here — that failure is what shows
\* the governor is necessary, not merely correct.
SPECIFICATION Spec
CONSTANTS
    Jobs <- MCJobs
    Capacity <- MCCapacity
    Weight <- MCWeight
    Classical <- MCClassicalNone
    Governed <- FALSE
INVARIANT
    TypeOK
    NeverExceedsCapacity
    NoDoubleAccounting
