[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "aria-py"
version = "0.1.0"
description = "Python bindings for the Aria Quantum Language runtime (pure-Rust, no libtorch)."
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
# `pip install .[torch]` for the AriaLayer / autograd.Function bridge + bench.
torch = ["torch>=2.0"]
bench = ["pennylane>=0.35"]

[tool.maturin]
# The compiled extension goes into the `aria_py` package next to the .py layer.
module-name = "aria_py._aria_py"
python-source = "python"
manifest-path = "Cargo.toml"
