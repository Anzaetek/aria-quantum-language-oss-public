# SPDX-License-Identifier: Apache-2.0
[package]
name = "omega-xcheck"
version = "0.1.0"
edition = "2021"
publish = false
# Two binaries live here now (the statevector harness and pauliprop_xcheck), so
# a bare `cargo run -p omega-xcheck` is ambiguous without this.
default-run = "omega-xcheck"
description = "Differential cross-check harness: emits random Clifford circuits and every backend's probabilities for tools/qiskit_xcheck/compare.py"

[dependencies]
omega-core = { path = "../omega-core" }
omega-backend-statevector = { path = "../omega-backend-statevector" }
omega-backend-pauli = { path = "../omega-backend-pauli" }
omega-backend-pauliprop = { path = "../omega-backend-pauliprop" }
smallvec = "1"

[target.'cfg(target_os = "macos")'.dependencies]
omega-backend-statevector-metal = { path = "../omega-backend-statevector-metal" }

[features]
metal = ["omega-backend-statevector-metal/metal"]
