[package]
name = "omega-backend-pauliprop"
version = "0.1.0"
edition = "2021"
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Pauli-propagation (Heisenberg-picture) backend for the omega runtime."

[lib]
crate-type = ["rlib"]

[dependencies]
omega-core = { path = "../omega-core" }
num-complex = { workspace = true }
# PauliKey packs its symplectic bits into u64 words with inline capacity for
# n <= 128, so a key allocates nothing at any width this engine is used at.
smallvec = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
num-complex = { workspace = true }
smallvec = { workspace = true }
# The conditional-refusal test asserts the value pauliprop USED to return
# silently is wrong, and gets "wrong" from the statevector backend running the
# same circuit rather than from arithmetic in the test. A hand-computed
# expected value is a second implementation with no reviewer.
omega-backend-statevector = { path = "../omega-backend-statevector" }
# The sqrt-X conjugation test cross-checks against the stabilizer backend,
# which encodes the same Clifford rule in a genuinely different form (bit-level
# tableau vs Pauli-image table). Weak evidence on its own — see K3 — but it
# would take a shared misreading to survive both representations.
omega-backend-pauli = { path = "../omega-backend-pauli" }
# The monoprop cross-check (tests/monoprop_xcheck.rs) renders each fixture
# circuit to OpenQASM 2 and lowers it through the real parser, so the r<P>(θ)
# sign convention is exercised by the production path, not re-typed in the
# test. serde_json reads the committed fixture.
omega-parser = { path = "../omega-parser" }
serde_json = { workspace = true }

[[bench]]
name = "pauliprop_bench"
harness = false
