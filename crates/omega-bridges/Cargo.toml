[package]
name = "omega-bridges"
version = "0.1.0"
edition = "2021"
description = "Run QASM2 circuits through external quantum simulators / hardware backends (Qiskit, Perceval, …)."
license = "MIT"
publish = false

# Soft-fail design: every backend is opt-in via a Cargo feature. The
# default build pulls in nothing external, so `cargo build --workspace`
# stays clean on hosts without Python / Qiskit / Perceval installed.
# The dispatcher returns BridgeError::NotCompiled for any backend whose
# feature isn't enabled.
[features]
default = []
bridge-qiskit = []
bridge-perceval = []
# Bloqade (QuEra Aquila) via the Python `bloqade` / `bloqade-circuit`
# stack. Gate mode (QASM2 → counts) lands first; analog AHS mode is
# stubbed for now and returns a typed `Unavailable` until the AHS
# input shape lands.
bridge-bloqade = []
# QuEra ppvm — Pauli-sum propagation. Present as an INDEPENDENT VALIDATOR for
# omega-backend-pauliprop (same algorithm family), not as a new capability.
bridge-ppvm = []
# QuEra tsim — ZX stabilizer-rank sampler. New capability; note the bridge
# carries QASM2 + counts only, so detector/observable sampling is out of reach.
bridge-tsim = []
# IBM ffsim — fermionic simulation in the fixed-particle-number basis. Present
# as the DIFFERENTIAL ANCHOR for the fermionic surface (Rbs / CPhase / JW),
# expectation-only, fed over QPY rather than QASM2. See `src/ffsim.rs`.
bridge-ffsim = []
# Reserved for follow-ups so PRs can land each backend as a self-contained
# commit once the dispatch surface is in place.
bridge-cirq = []
bridge-qadence = []

[dependencies]
omega-core = { path = "../omega-core" }
serde_json = { workspace = true }
thiserror = { workspace = true }
base64 = { workspace = true }
# `qpy::builder` constructs `omega_core::circuit::GateOp` whose
# qubit / param fields are `SmallVec`s; pulling smallvec keeps the
# builder free of allocations on the typical 1–3-qubit gate path.
smallvec = { workspace = true }

[dev-dependencies]
tempfile = "3.10"
# Test-only. `opticqasm_perceval_agreement.rs` drives OUR emitted OPTICQASM
# through both Perceval and this workspace's photonic backend and compares the
# numbers — the DV half of PLAN-OPTICQASM-INTEGRITY.md O5. The emitter lives in
# aria-core and the lowering in omega-parser, neither of which this crate needs
# at runtime.
aria-core = { path = "../aria-core" }
# `f4-tunnel-theta-hook` is the F4.3 sign flip. The integration test is a
# separate crate, so `cfg(test)` on omega-parser is off when this links it.
omega-parser = { path = "../omega-parser", features = ["f4-tunnel-theta-hook"] }
# Test-only: `pauliprop_vs_ppvm.rs` compares OUR Pauli-propagation backend
# against ppvm's independent implementation of the same algorithm. The existing
# ppvm test anchors ppvm against qiskit; nothing put our own backend on that
# path, despite the doc comment saying that was the point.
omega-backend-pauliprop = { path = "../omega-backend-pauliprop" }
# Test-only: `wide_counts_vs_qiskit_mps.rs` compares OUR MPS sampling against
# Aer's matrix-product-state method at widths a dense statevector cannot reach.
# Above ~30 qubits there is no dense oracle to be the second opinion.
omega-backend-mps = { path = "../omega-backend-mps" }
omega-backend-photonics = { path = "../omega-backend-photonics" }
# Test-only: `ffsim_vs_statevector.rs` runs the SAME `CircuitIR` through
# ffsim (fermionic basis, over QPY) and OUR statevector backend, read out
# through the SAME Jordan–Wigner observables — the differential anchor
# `PLAN-OPEN-20260825.md` §3c.0e item 2 exists for. The closed-form fixtures
# in `ffsim_expectation.rs` check ffsim; this checks T1's mapper against it.
omega-backend-statevector = { path = "../omega-backend-statevector" }
# Test-only, same file: the current operator i(a†a − h.c.) needs a complex
# coefficient to construct.
num-complex = { workspace = true }
