[package]
name = "omega-bridges"
version = "0.1.0"
edition = "2021"
description = "Run QASM2 circuits through external quantum simulators / hardware backends (Qiskit, Perceval, …)."
license = "MIT"
publish = false

# Soft-fail design: every backend is opt-in via a Cargo feature. The
# default build pulls in nothing external, so `cargo build --workspace`
# stays clean on hosts without Python / Qiskit / Perceval installed.
# The dispatcher returns BridgeError::NotCompiled for any backend whose
# feature isn't enabled.
[features]
default = []
bridge-qiskit = []
bridge-perceval = []
# Bloqade (QuEra Aquila) via the Python `bloqade` / `bloqade-circuit`
# stack. Gate mode (QASM2 → counts) lands first; analog AHS mode is
# stubbed for now and returns a typed `Unavailable` until the AHS
# input shape lands.
bridge-bloqade = []
# QuEra ppvm — Pauli-sum propagation. Present as an INDEPENDENT VALIDATOR for
# omega-backend-pauliprop (same algorithm family), not as a new capability.
bridge-ppvm = []
# QuEra tsim — ZX stabilizer-rank sampler. New capability; note the bridge
# carries QASM2 + counts only, so detector/observable sampling is out of reach.
bridge-tsim = []
# Reserved for follow-ups so PRs can land each backend as a self-contained
# commit once the dispatch surface is in place.
bridge-cirq = []
bridge-qadence = []

[dependencies]
omega-core = { path = "../omega-core" }
serde_json = { workspace = true }
thiserror = { workspace = true }
base64 = { workspace = true }
# `qpy::builder` constructs `omega_core::circuit::GateOp` whose
# qubit / param fields are `SmallVec`s; pulling smallvec keeps the
# builder free of allocations on the typical 1–3-qubit gate path.
smallvec = { workspace = true }

[dev-dependencies]
tempfile = "3.10"
