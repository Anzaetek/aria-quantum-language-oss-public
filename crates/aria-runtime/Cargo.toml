# aria-runtime — execution layer for the Aria Quantum Language.
#
# Lowers the Aria `Circuit` into omega-core's in-process `CircuitIR`
# (symbol-preserving, so trainable parameters survive for QML) and runs it on
# a pluggable backend. The pure-Rust statevector backend is the default; MPS,
# GPU, libtorch (`tch`), and remote backends drop in as additional features
# and all speak the same `omega_core::executor::Backend` trait.
[package]
name = "aria-runtime"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Execution runtime for the Aria Quantum Language: lowers Circuit to the omega IR and runs it on pluggable backends."

[features]
default = []
# Apple Metal GPU statevector. Verified on macOS; on other targets the metal
# crate compiles to a runtime-unavailable stub and `--backend gpu` falls back.
metal = [
    "dep:omega-backend-statevector-metal",
    "omega-backend-statevector-metal/metal",
    "omega-core/metal",
    "dep:omega-backend-mps-metal",
    "omega-backend-mps-metal/metal",
    "dep:omega-backend-pauliprop-metal",
    "omega-backend-pauliprop-metal/metal",
]
# NVIDIA CUDA GPU statevector + MPS bond-compression SVD (Linux/Windows + cu12).
cuda = [
    "dep:omega-backend-statevector-cuda",
    "omega-backend-statevector-cuda/cuda",
    "omega-core/cuda",
    "dep:omega-backend-mps-cuda",
    "omega-backend-mps-cuda/cuda",
    "dep:omega-backend-pauliprop-cuda",
    "omega-backend-pauliprop-cuda/cuda",
]
# Cross-vendor OpenCL statevector (needs an ICD installed).
opencl = [
    "dep:omega-backend-statevector-opencl",
    "omega-backend-statevector-opencl/opencl",
    "omega-core/opencl",
]
# Delegate execution to a running omega-server over HTTP (`--backend remote`).
remote = ["dep:ureq", "dep:serde"]
# libtorch (tch) statevector backend (`--backend tch`). Heavy: links libtorch.
# Needs LIBTORCH set at build/run time (see INSTALL_LIBTORCH.md).
tch = ["dep:aria-backend-tch"]

[dependencies]
aria-core = { path = "../aria-core" }
omega-core = { path = "../omega-core" }
omega-backend-statevector = { path = "../omega-backend-statevector" }
omega-backend-mps = { path = "../omega-backend-mps" }
omega-backend-pauliprop = { path = "../omega-backend-pauliprop" }
num-complex = { workspace = true }
ndarray = { workspace = true }
# Used to parse the `--noise` model JSON (see run::parse_noise_model).
serde_json = { workspace = true }

# GPU backends (optional, feature-gated). Each implements omega_core::Backend.
omega-backend-statevector-metal = { path = "../omega-backend-statevector-metal", optional = true }
omega-backend-statevector-cuda = { path = "../omega-backend-statevector-cuda", optional = true }
omega-backend-statevector-opencl = { path = "../omega-backend-statevector-opencl", optional = true }
# CUDA cuSOLVER `gesvdj` accelerator for MPS bond-compression SVD (opt-in via `cuda`).
omega-backend-mps-cuda = { path = "../omega-backend-mps-cuda", optional = true }
# CUDA branch-expansion accelerator for the pauliprop backend (opt-in via `cuda`).
omega-backend-pauliprop-cuda = { path = "../omega-backend-pauliprop-cuda", optional = true }
# Metal θ-contraction accelerator for MPS two-site gates (opt-in via `metal`).
omega-backend-mps-metal = { path = "../omega-backend-mps-metal", optional = true }
# Metal branch-expansion accelerator for the pauliprop backend (opt-in via `metal`).
omega-backend-pauliprop-metal = { path = "../omega-backend-pauliprop-metal", optional = true }

# Remote (omega-server HTTP) backend.
ureq = { version = "2", default-features = false, features = ["json"], optional = true }
serde = { workspace = true, optional = true }

# libtorch backend (optional; the crate is excluded from the default workspace).
aria-backend-tch = { path = "../aria-backend-tch", optional = true }

[dev-dependencies]
# Read the Metal accelerators' telemetry counters in the metal-gated parity
# tests. No feature here: when aria-runtime is tested with `--features metal`,
# Cargo unifies these onto the same (metal-enabled) crate instances the runtime
# drives, so the counters the tests read are the ones the runtime increments.
# On non-macOS / default builds they compile to inert stubs.
omega-backend-mps-metal = { path = "../omega-backend-mps-metal" }
omega-backend-pauliprop-metal = { path = "../omega-backend-pauliprop-metal" }
