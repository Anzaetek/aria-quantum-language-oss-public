[package]
name = "omega-backend-photonics"
version = "0.1.0"
edition = "2021"
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Photonic/Fock-space simulation backend for the omega runtime."

[lib]
crate-type = ["rlib"]

[dependencies]
omega-core = { path = "../omega-core" }
num-complex = { workspace = true }
smallvec = { workspace = true }
rand = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
# Test-only: the polarization convention test lowers real OPTICQASM source and
# reads the resulting mode unitary. Going through the parser is the point —
# testing a hand-built op list would not catch a lowering bug, which is where
# the polarization expansion actually lives.
omega-parser = { path = "../omega-parser" }

[[bench]]
name = "photonics_bench"
harness = false
