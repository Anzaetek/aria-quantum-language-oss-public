[package]
name = "omega-backend-cv"
version = "0.1.0"
edition = "2021"
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Continuous-variable photonic simulation on a truncated Fock space."

[dependencies]
num-complex = { workspace = true }

# Test-only. The shipped library keeps its single runtime dependency — this
# crate is meant to be embeddable (docs/LIBRARY.md), and a dev-dependency does
# not travel with the cdylib.
[dev-dependencies]
serde_json = { workspace = true }
# Test-only, and it must stay test-only: this crate ships with a single runtime
# dependency so it remains embeddable (see the crate docs), which is also why
# `CvProgram` lives in the parser rather than here. `opticqasm_cv_xcheck.rs`
# drives OPTICQASM text through the CV import and compares against the piquasso
# fixture — a dev-dependency does not travel with the cdylib.
omega-parser = { path = "../omega-parser" }
